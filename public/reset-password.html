<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password | SAPC AI Academic Reviewer</title>
  <link rel="stylesheet" href="style.css?v=20261108-reset-v1" />
  <style>
    .reset-page { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
    .reset-card { width: min(100%, 430px); padding: 32px 28px; background: var(--paper); border: 1px solid var(--line); border-top: 5px solid var(--primary); border-radius: 16px; box-shadow: var(--shadow); }
    .reset-card h1 { margin: 0 0 8px; color: var(--primary); font-family: "Plus Jakarta Sans", sans-serif; font-size: 1.55rem; }
    .reset-card p { color: var(--muted); line-height: 1.5; }
    .reset-card label { display: block; margin: 20px 0 7px; color: var(--ink); font-size: .82rem; font-weight: 700; }
    .reset-card input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); font: inherit; }
    .reset-card button { width: 100%; margin-top: 18px; }
    .reset-message { margin-bottom: 0; font-weight: 600; }
    .reset-message.error { color: #a33434; }
    .reset-message.success { color: #28734a; }
    .reset-brand { margin: 0 0 22px; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>
<body class="light-theme">
  <main class="reset-page">
    <section class="reset-card">
      <p class="reset-brand">SAPC AI Academic Reviewer</p>
      <h1>Reset your password</h1>
      <p id="reset-description">Choose a new password for your account.</p>
      <form id="reset-form">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" minlength="8" autocomplete="new-password" required />
        <button class="primary-btn" type="submit">Save new password</button>
      </form>
      <p id="reset-message" class="reset-message hidden" role="alert"></p>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get("mode");
    const code = params.get("oobCode");
    const form = document.getElementById("reset-form");
    const message = document.getElementById("reset-message");
    const description = document.getElementById("reset-description");

    function showMessage(text, kind) {
      message.textContent = text;
      message.className = `reset-message ${kind}`;
      form.classList.toggle("hidden", kind === "success");
    }

    if (mode !== "resetPassword" || !code || !window.SAPC_FIREBASE_CONFIG) {
      showMessage("This password-reset link is invalid or incomplete.", "error");
    } else {
      firebase.initializeApp(window.SAPC_FIREBASE_CONFIG);
      firebase.auth().verifyPasswordResetCode(code)
        .then(email => {
          description.textContent = `Choose a new password for ${email}.`;
        })
        .catch(() => showMessage("This password-reset link has expired or was already used.", "error"));

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.getElementById("new-password").value;
        if (password.length < 8) {
          showMessage("Your password must be at least 8 characters long.", "error");
          return;
        }
        try {
          await firebase.auth().confirmPasswordReset(code, password);
          showMessage("Password updated. You can now return to the app and sign in.", "success");
        } catch (error) {
          showMessage(error.message || "Unable to update your password.", "error");
        }
      });
    }
  </script>
</body>
</html>
